
@if (page; as p) {

  <div class="ctpl-about-detail-page">

    <section class="ctpl-about-detail-hero">
      <div class="container">

        <span class="ctpl-about-detail-hero-label">
          CTPL / ABOUT
        </span>

        <h1>{{ p.title }}</h1>

      </div>
    </section>

    <section class="ctpl-about-detail-section">
      <div class="container">

        <div class="ctpl-about-detail-grid">

          <div class="ctpl-about-detail-text">

            <span class="ctpl-about-detail-label">
              {{ p.eyebrow }}
            </span>

            <h2>{{ p.title }}</h2>

            <p class="ctpl-about-detail-summary">
              {{ p.summary }}
            </p>

            <h3>Features & Information</h3>

            <ul class="ctpl-about-first-point">
              @if (p.bullets?.length) {
                <li>{{ p.bullets?.[0] }}</li>
              }
            </ul>

          </div>

          <div class="ctpl-about-detail-image">
            @if (p.image) {
              <img
                [src]="p.image"
                [alt]="p.title"
                loading="lazy"
              />
            }
          </div>

        </div>

        <div class="ctpl-about-detail-more">
          <ul>
            @for (
              bullet of p.bullets?.slice(1) ?? [];
              track $index
            ) {
              <li>{{ bullet }}</li>
            }
          </ul>
        </div>

      </div>
    </section>

  </div>

}
