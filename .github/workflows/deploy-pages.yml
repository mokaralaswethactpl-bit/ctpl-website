name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ctpl-website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ctpl-website

      - name: Build site
        run: npm run build -- --configuration github-pages
        working-directory: ctpl-website

      - name: Add SPA fallback
        run: cp dist/ContaineWeb/browser/index.html dist/ContaineWeb/browser/404.html
        working-directory: ctpl-website

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ctpl-website/dist/ContaineWeb/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
