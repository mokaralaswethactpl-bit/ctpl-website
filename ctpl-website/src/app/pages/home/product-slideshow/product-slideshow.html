
<!-- ==========================================
     CTPL 360-DEGREE ORBIT CAROUSEL
========================================== -->

<section
  class="ctpl-product-showcase"
  aria-label="CTPL Product Portfolio"
>

  <!-- GRADIENT DECORATIONS -->

  <div
    class="showcase-glow showcase-glow-one"
    aria-hidden="true"
  ></div>

  <div
    class="showcase-glow showcase-glow-two"
    aria-hidden="true"
  ></div>

  <div
    class="showcase-light-track"
    aria-hidden="true"
  ></div>


  <div class="showcase-container">

    <!-- ======================================
         SECTION HEADING
    ====================================== -->

    <div class="showcase-heading">

      <span class="showcase-eyebrow">
        CTPL PRODUCT PORTFOLIO
      </span>

      <h2>Explore Our Products</h2>

      <p>
        Advanced vehicle electronics for safer,
        smarter and more connected mobility.
      </p>

    </div>


    <!-- ======================================
         CONTINUOUS ROTATING CARDS
    ====================================== -->

    <div
      class="ctpl-orbit-stage"
      (mouseenter)="pauseOnHover()"
      (mouseleave)="resumeOnLeave()"
      aria-label="Rotating product showcase"
    >

      <!-- DECORATIVE ORBIT TRACK -->

      <div
        class="ctpl-orbit-ring"
        aria-hidden="true"
      ></div>


      <!-- ALL SIX PRODUCT CARDS -->

      @for (
        item of products;
        track item.slug;
        let i = $index
      ) {

        <article
          #orbitCard
          class="ctpl-orbit-card"
          [class.is-front]="activeIndex() === i"
        >

          <!-- SELECT THE PRODUCT CARD -->

          <button
            type="button"
            class="ctpl-orbit-card-select"
            (click)="focusProduct(i)"
            [attr.aria-label]="'Bring ' + item.title + ' to front'"
          ></button>


          <!-- PRODUCT IMAGE -->

          <div class="ctpl-orbit-image-panel">

            @if (item.image) {

              <img
                [src]="item.image"
                [alt]="item.title"
                loading="lazy"
              />

            }

          </div>


          <!-- PRODUCT CONTENT -->

          <div class="ctpl-orbit-information">

            <span class="ctpl-orbit-category">
              {{ item.eyebrow }}
            </span>

            <h3>
              {{ item.title }}
            </h3>

            <p>
              {{ item.summary }}
            </p>

            <a
              class="showcase-explore-button"
              [routerLink]="getProductRoute(item.slug)"
            >
              Explore Product
              <span aria-hidden="true">↗</span>
            </a>

          </div>

        </article>

      }


      <!-- PREVIOUS ARROW -->

      <button
        type="button"
        class="showcase-arrow showcase-arrow-left"
        (click)="previousSlide()"
        aria-label="Previous product"
      >
        <span aria-hidden="true">‹</span>
      </button>


      <!-- NEXT ARROW -->

      <button
        type="button"
        class="showcase-arrow showcase-arrow-right"
        (click)="nextSlide()"
        aria-label="Next product"
      >
        <span aria-hidden="true">›</span>
      </button>

    </div>


    <!-- ======================================
         SMALL PLAY / PAUSE CONTROL
    ====================================== -->

    <div class="ctpl-orbit-footer">

      <button
        type="button"
        class="ctpl-orbit-play-button"
        (click)="toggleRotation()"
        [attr.aria-label]="paused() ? 'Resume rotation' : 'Pause rotation'"
      >

        <span aria-hidden="true">
          {{ paused() ? '▶' : 'Ⅱ' }}
        </span>

        {{ paused() ? 'Resume rotation' : 'Pause rotation' }}

      </button>

    </div>

  </div>

</section>
