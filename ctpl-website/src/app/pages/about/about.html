
<section class="ctpl-about-overview">

  <!-- ==========================================
       ABOUT PAGE HEADER
  ========================================== -->

  <section class="ctpl-about-page-header">

    <div class="container">

      <div class="ctpl-about-heading">

        <span class="ctpl-about-eyebrow">
          CTPL / ABOUT
        </span>

        <h1>About</h1>

        <p>
          Explore our company, mission,
          capabilities and presence.
        </p>

        <!-- BACK TO HOME BUTTON -->

        <a routerLink="/" class="ctpl-about-back-btn">

          <span class="back-arrow">←</span>

          Back to Home

        </a>

      </div>

    </div>

  </section>


  <!-- ==========================================
       ABOUT PAGE BODY
  ========================================== -->

  <section class="ctpl-about-page-body">

    <div class="container">

      <div class="ctpl-about-cards">

        @for (page of aboutPages; track page.slug) {

          <a
            class="ctpl-about-card"
            [routerLink]="['/page', page.slug]"
          >

            <!-- CARD IMAGE -->

            <div class="ctpl-about-card-image">

              @if (page.image) {

                <img
                  [src]="page.image"
                  [alt]="page.title"
                  loading="lazy"
                />

              }

            </div>


            <!-- CARD CONTENT -->

            <div class="ctpl-about-card-body">

              <span class="ctpl-about-card-label">
                {{ page.eyebrow }}
              </span>

              <h2>{{ page.title }}</h2>

              <p>{{ page.summary }}</p>

              <span class="ctpl-about-card-link">
                Read more ↗
              </span>

            </div>

          </a>

        }

      </div>

    </div>

  </section>

</section>
